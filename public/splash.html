<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif;
    background: #fafaf8;
    display: flex; align-items: center; justify-content: center;
    height: 100vh; width: 100vw;
    overflow: hidden; user-select: none;
    -webkit-app-region: drag;
  }
  .splash {
    display: flex; flex-direction: column; align-items: center; gap: 20px;
  }
  .logo {
    width: 72px; height: 72px;
    border-radius: 16px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    animation: float 2.4s ease-in-out infinite;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }
  .title {
    font-size: 20px; font-weight: 700; color: #1a1a1a;
    letter-spacing: 0.5px;
  }
  .subtitle {
    font-size: 12px; color: #999;
    margin-top: -12px;
  }
  .loader {
    display: flex; gap: 6px; margin-top: 4px;
  }
  .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: #e05533;
    animation: bounce 1.2s ease-in-out infinite;
  }
  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {
    0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
    40% { transform: scale(1); opacity: 1; }
  }
  .status {
    font-size: 11px; color: #bbb;
    min-height: 16px; transition: opacity 0.3s;
  }
</style>
</head>
<body>
  <div class="splash">
    <img class="logo" src="logo.png" alt="logo" onerror="this.style.background='#e05533';this.style.borderRadius='16px'">
    <div class="title">MiClaw</div>
    <div class="subtitle">AI Agent Desktop</div>
    <div class="loader">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
    <div class="status" id="status">正在初始化...</div>
  </div>
  <script>
    const { ipcRenderer } = require('electron');
    ipcRenderer.on('splash:status', (_, msg) => {
      document.getElementById('status').textContent = msg;
    });
  </script>
</body>
</html>
